services:
  qbot-bus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feynman-qbot-bus
    command: uvicorn bus.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qbot-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feynman-qbot-dashboard
    command: streamlit run frontend/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DEFAULT_BUS_URL=http://qbot-bus:8000
    volumes:
      - .:/app
    depends_on:
      qbot-bus:
        condition: service_healthy
    restart: unless-stopped
