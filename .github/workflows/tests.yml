name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: bridge / app / persona tests
        run: python -m unittest discover -s tests -t . -v
      - name: right brain tests
        working-directory: right
        run: python -m unittest discover -s omega_mind/tests
      - name: card coverage (no row disappears silently)
        run: python tools/card_coverage.py
